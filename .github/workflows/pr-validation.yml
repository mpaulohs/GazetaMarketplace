name: PR Validation Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - develop

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to validate'
        required: false
        type: number

# Cancel in-progress runs for the same PR
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Step 1: Authorization Check
  # ============================================================================
  authorization:
    name: "1️⃣ Authorization Check"
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.check-auth.outputs.authorized }}
      actor: ${{ steps.check-auth.outputs.actor }}
      association: ${{ steps.check-auth.outputs.association }}
      reason: ${{ steps.check-auth.outputs.reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check authorization
        id: check-auth
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');

            // Get the PR author
            const actor = context.payload.pull_request?.user?.login || context.actor;
            console.log(`Checking authorization for user: ${actor}`);

            // Load authorization config
            let config;
            try {
              const configFile = fs.readFileSync('.github/claude-authorized-users.yml', 'utf8');
              config = yaml.load(configFile);
            } catch (error) {
              console.log('Authorization config not found, allowing all users');
              core.setOutput('authorized', 'true');
              core.setOutput('reason', 'No authorization config - allowing all');
              core.setOutput('actor', actor);
              core.setOutput('association', 'UNKNOWN');
              return;
            }

            // Check emergency circuit breaker
            if (config.emergency && config.emergency.enabled === true) {
              const reason = config.emergency.reason || 'Emergency circuit breaker activated';
              console.log(`❌ Circuit breaker enabled: ${reason}`);
              core.setOutput('authorized', 'false');
              core.setOutput('reason', reason);
              core.setOutput('actor', actor);
              core.setOutput('association', 'BLOCKED_BY_CIRCUIT_BREAKER');
              return;
            }

            // Get user's association with the repository
            let association = 'NONE';
            let userPermission = 'none';

            try {
              const { data: permissionData } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor
              });
              userPermission = permissionData.permission;

              // Get author association from PR
              association = context.payload.pull_request?.author_association || 'NONE';

              console.log(`User association: ${association}`);
              console.log(`User permission: ${userPermission}`);
            } catch (error) {
              console.log(`Could not determine user association: ${error.message}`);
            }

            // Check if user is repository owner
            const isOwner = association === 'OWNER' || userPermission === 'admin';

            // Check if user is collaborator
            const isCollaborator = ['write', 'maintain', 'admin'].includes(userPermission);

            // Check if user is org member
            const isMember = association === 'MEMBER';

            // Check if user is first-time contributor
            const isFirstTime = association === 'FIRST_TIME_CONTRIBUTOR';

            // Check if user is in explicit authorized list
            const isExplicitlyAuthorized = config.authorized_users &&
                                          config.authorized_users.includes(actor);

            console.log(`Authorization checks:`);
            console.log(`  - Is owner: ${isOwner}`);
            console.log(`  - Is collaborator: ${isCollaborator}`);
            console.log(`  - Is org member: ${isMember}`);
            console.log(`  - Is first-time: ${isFirstTime}`);
            console.log(`  - Explicitly authorized: ${isExplicitlyAuthorized}`);

            // Determine authorization
            let authorized = false;
            let reason = '';

            if (isExplicitlyAuthorized) {
              authorized = true;
              reason = 'User is in authorized users list';
            } else if (isOwner && config.settings?.allow_owner !== false) {
              authorized = true;
              reason = 'User is repository owner';
            } else if (isCollaborator && config.settings?.allow_collaborators === true) {
              authorized = true;
              reason = 'User is repository collaborator';
            } else if (isMember && config.settings?.allow_org_members === true) {
              authorized = true;
              reason = 'User is organization member';
            } else if (isFirstTime && config.settings?.block_first_time_contributors === true) {
              authorized = false;
              reason = 'First-time contributors require approval';
            } else if (association === 'NONE' && config.settings?.block_external_contributors === true) {
              authorized = false;
              reason = 'External contributors require approval';
            } else {
              // Default: allow if no strict config
              authorized = true;
              reason = 'Default authorization granted';
            }

            console.log(`\nAuthorization Decision:`);
            console.log(`  User: ${actor}`);
            console.log(`  Association: ${association}`);
            console.log(`  Authorized: ${authorized}`);
            console.log(`  Reason: ${reason}`);

            core.setOutput('authorized', authorized.toString());
            core.setOutput('reason', reason);
            core.setOutput('actor', actor);
            core.setOutput('association', association);

            // Create summary
            await core.summary
              .addHeading('1️⃣ Authorization Check')
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['User', actor],
                ['Association', association],
                ['Authorized', authorized ? '✅ Yes' : '❌ No'],
                ['Reason', reason]
              ])
              .write();

      - name: Fail if unauthorized
        if: steps.check-auth.outputs.authorized != 'true'
        run: |
          echo "::error::PR author is not authorized"
          exit 1

  # ============================================================================
  # Step 2: PR Guardrails
  # ============================================================================
  guardrails:
    name: "2️⃣ PR Guardrails"
    runs-on: ubuntu-latest
    needs: authorization
    if: needs.authorization.outputs.authorized == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PR size
        id: check-size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const totalChanges = additions + deletions;
            const filesChanged = pr.changed_files || 0;

            const MAX_SIZE = 2000;
            const isOwner = '${{ needs.authorization.outputs.association }}' === 'OWNER';

            console.log(`PR Size Check:`);
            console.log(`  Additions: ${additions}`);
            console.log(`  Deletions: ${deletions}`);
            console.log(`  Total changes: ${totalChanges}`);
            console.log(`  Files changed: ${filesChanged}`);

            let status = 'pass';
            const findings = [];

            if (totalChanges > MAX_SIZE) {
              const severity = isOwner ? 'warning' : 'error';
              status = isOwner ? 'warning' : 'failed';

              findings.push({
                severity: severity,
                category: 'PR Size',
                message: `PR has ${totalChanges} lines changed (limit: ${MAX_SIZE})`,
                remediation: 'Consider splitting this PR into smaller, more focused PRs'
              });
            }

            core.setOutput('total_changes', totalChanges);
            core.setOutput('files_changed', filesChanged);
            core.setOutput('status', status);
            core.setOutput('findings', JSON.stringify(findings));

      - name: Check PR description
        id: check-description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const MIN_LENGTH = 20;

            console.log(`PR Description Check:`);
            console.log(`  Length: ${body.length} characters`);

            const findings = [];

            if (body.length < MIN_LENGTH) {
              findings.push({
                severity: 'warning',
                category: 'PR Description',
                message: `PR description is too short (${body.length} characters, minimum: ${MIN_LENGTH})`,
                remediation: 'Add a meaningful description explaining what changes were made and why'
              });
            }

            core.setOutput('findings', JSON.stringify(findings));

      - name: Aggregate guardrails results
        id: aggregate
        uses: actions/github-script@v7
        with:
          script: |
            const sizeFindings = JSON.parse('${{ steps.check-size.outputs.findings }}' || '[]');
            const descFindings = JSON.parse('${{ steps.check-description.outputs.findings }}' || '[]');

            const allFindings = [...sizeFindings, ...descFindings];

            const summary = {
              total: allFindings.length,
              errors: allFindings.filter(f => f.severity === 'error').length,
              warnings: allFindings.filter(f => f.severity === 'warning').length,
              info: allFindings.filter(f => f.severity === 'info').length
            };

            let status = '${{ steps.check-size.outputs.status }}';
            if (summary.errors > 0) {
              status = 'failed';
            } else if (summary.warnings > 0 && status === 'pass') {
              status = 'warning';
            }

            const result = {
              step: 'guardrails',
              status: status,
              timestamp: new Date().toISOString(),
              findings: allFindings,
              summary: summary
            };

            core.setOutput('result', JSON.stringify(result));
            core.setOutput('status', status);

            // Create step summary
            await core.summary
              .addHeading('2️⃣ PR Guardrails')
              .addTable([
                [{data: 'Check', header: true}, {data: 'Result', header: true}],
                ['PR Size', `${context.payload.pull_request.additions + context.payload.pull_request.deletions} lines (${context.payload.pull_request.changed_files} files)`],
                ['Description Length', `${(context.payload.pull_request.body || '').length} characters`],
                ['Status', status === 'pass' ? '✅ Pass' : status === 'warning' ? '⚠️ Warning' : '❌ Failed'],
                ['Issues Found', `${summary.total} (${summary.errors} errors, ${summary.warnings} warnings)`]
              ])
              .write();

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(`${{ steps.aggregate.outputs.result }}`);

            // Format the comment using PowerShell script
            const { execSync } = require('child_process');
            const fs = require('fs');

            // Write result to temp file
            fs.writeFileSync('/tmp/result.json', JSON.stringify(result));

            // Run PowerShell formatter
            const markdown = execSync(
              `pwsh -File .github/scripts/format-pr-comment.ps1 ` +
              `-InputJson '${JSON.stringify(result)}' ` +
              `-StepNumber 2 ` +
              `-StepName "PR Guardrails" ` +
              `-Emoji "🛡️" ` +
              `-RunUrl "${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}"`,
              { encoding: 'utf8' }
            );

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('<!-- pr-validation:step-2 -->')
            );

            // Create or update comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: markdown
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: markdown
              });
            }

      - name: Fail if guardrails failed
        if: steps.aggregate.outputs.status == 'failed'
        run: |
          echo "::error::PR guardrails check failed"
          exit 1

  # ============================================================================
  # Step 3: Quality Checks
  # ============================================================================
  quality-checks:
    name: "3️⃣ Quality Checks"
    runs-on: ubuntu-latest
    needs: guardrails

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Check code formatting
        id: check-format
        continue-on-error: true
        run: |
          echo "Running dotnet format..."
          dotnet format --verify-no-changes --verbosity diagnostic > format-output.txt 2>&1 || echo "FORMAT_FAILED=true" >> $GITHUB_ENV
          cat format-output.txt

      - name: Build solution
        id: build
        continue-on-error: true
        run: |
          echo "Building solution..."
          dotnet build --no-restore --verbosity normal > build-output.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV
          cat build-output.txt

      - name: Run unit tests
        id: test
        continue-on-error: true
        run: |
          echo "Running tests..."
          dotnet test --no-build --verbosity normal --logger "console;verbosity=detailed" > test-output.txt 2>&1 || echo "TEST_FAILED=true" >> $GITHUB_ENV
          cat test-output.txt

      - name: Parse quality check results
        id: parse-results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const findings = [];

            // Check formatting results
            if (process.env.FORMAT_FAILED === 'true') {
              try {
                const formatOutput = fs.readFileSync('format-output.txt', 'utf8');
                const lines = formatOutput.split('\n');

                // Parse format violations
                for (const line of lines) {
                  if (line.includes('.cs(') || line.includes('warning')) {
                    findings.push({
                      severity: 'warning',
                      category: 'Code Formatting',
                      message: line.trim(),
                      remediation: 'Run `dotnet format` to fix formatting issues'
                    });
                  }
                }

                if (findings.length === 0) {
                  findings.push({
                    severity: 'error',
                    category: 'Code Formatting',
                    message: 'Code formatting check failed',
                    remediation: 'Run `dotnet format` to fix formatting issues'
                  });
                }
              } catch (error) {
                console.log('Could not parse format output:', error);
              }
            }

            // Check build results
            if (process.env.BUILD_FAILED === 'true') {
              try {
                const buildOutput = fs.readFileSync('build-output.txt', 'utf8');
                const lines = buildOutput.split('\n');

                for (const line of lines) {
                  if (line.includes('error CS') || line.includes('error MSB')) {
                    findings.push({
                      severity: 'error',
                      category: 'Build',
                      message: line.trim(),
                      remediation: 'Fix compilation errors'
                    });
                  } else if (line.includes('warning CS') || line.includes('warning MSB')) {
                    findings.push({
                      severity: 'warning',
                      category: 'Build',
                      message: line.trim(),
                      remediation: 'Fix compilation warnings (TreatWarningsAsErrors is enabled)'
                    });
                  }
                }

                if (findings.filter(f => f.category === 'Build').length === 0) {
                  findings.push({
                    severity: 'error',
                    category: 'Build',
                    message: 'Build failed',
                    remediation: 'Check build output for errors'
                  });
                }
              } catch (error) {
                console.log('Could not parse build output:', error);
              }
            }

            // Check test results
            if (process.env.TEST_FAILED === 'true') {
              try {
                const testOutput = fs.readFileSync('test-output.txt', 'utf8');
                const lines = testOutput.split('\n');

                for (const line of lines) {
                  if (line.includes('Failed!') || line.includes('[FAIL]')) {
                    findings.push({
                      severity: 'error',
                      category: 'Tests',
                      message: line.trim(),
                      remediation: 'Fix failing tests'
                    });
                  }
                }

                if (findings.filter(f => f.category === 'Tests').length === 0) {
                  findings.push({
                    severity: 'error',
                    category: 'Tests',
                    message: 'Tests failed',
                    remediation: 'Run `dotnet test` locally to see failing tests'
                  });
                }
              } catch (error) {
                console.log('Could not parse test output:', error);
              }
            }

            // Calculate summary
            const summary = {
              total: findings.length,
              errors: findings.filter(f => f.severity === 'error').length,
              warnings: findings.filter(f => f.severity === 'warning').length,
              info: findings.filter(f => f.severity === 'info').length
            };

            let status = 'pass';
            if (summary.errors > 0) {
              status = 'failed';
            } else if (summary.warnings > 0) {
              status = 'warning';
            }

            const result = {
              step: 'quality-checks',
              status: status,
              timestamp: new Date().toISOString(),
              findings: findings,
              summary: summary
            };

            core.setOutput('result', JSON.stringify(result));
            core.setOutput('status', status);

            // Create step summary
            await core.summary
              .addHeading('3️⃣ Quality Checks')
              .addTable([
                [{data: 'Check', header: true}, {data: 'Result', header: true}],
                ['Code Formatting', process.env.FORMAT_FAILED === 'true' ? '❌ Failed' : '✅ Passed'],
                ['Build', process.env.BUILD_FAILED === 'true' ? '❌ Failed' : '✅ Passed'],
                ['Tests', process.env.TEST_FAILED === 'true' ? '❌ Failed' : '✅ Passed'],
                ['Status', status === 'pass' ? '✅ Pass' : status === 'warning' ? '⚠️ Warning' : '❌ Failed'],
                ['Issues Found', `${summary.total} (${summary.errors} errors, ${summary.warnings} warnings)`]
              ])
              .write();

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(`${{ steps.parse-results.outputs.result }}`);

            // Run PowerShell formatter
            const { execSync } = require('child_process');
            const markdown = execSync(
              `pwsh -File .github/scripts/format-pr-comment.ps1 ` +
              `-InputJson '${JSON.stringify(result)}' ` +
              `-StepNumber 3 ` +
              `-StepName "Quality Checks" ` +
              `-Emoji "✨" ` +
              `-RunUrl "${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}"`,
              { encoding: 'utf8' }
            );

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('<!-- pr-validation:step-3 -->')
            );

            // Create or update comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: markdown
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: markdown
              });
            }

      - name: Fail if quality checks failed
        if: steps.parse-results.outputs.status == 'failed'
        run: |
          echo "::error::Quality checks failed"
          exit 1

  # ============================================================================
  # Validation Complete Summary
  # ============================================================================
  validation-complete:
    name: "✅ Validation Complete"
    runs-on: ubuntu-latest
    needs: [authorization, guardrails, quality-checks]
    if: always()

    steps:
      - name: Create validation summary
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              authorization: {
                status: '${{ needs.authorization.result }}',
                actor: '${{ needs.authorization.outputs.actor }}',
                association: '${{ needs.authorization.outputs.association }}'
              },
              guardrails: {
                status: '${{ needs.guardrails.result }}'
              },
              qualityChecks: {
                status: '${{ needs.quality-checks.result }}'
              }
            };

            let overallStatus = '✅ Passed';
            const failedSteps = [];

            if (results.authorization.status !== 'success') {
              overallStatus = '❌ Failed';
              failedSteps.push('Authorization');
            }
            if (results.guardrails.status !== 'success') {
              overallStatus = '❌ Failed';
              failedSteps.push('PR Guardrails');
            }
            if (results.qualityChecks.status !== 'success') {
              overallStatus = '❌ Failed';
              failedSteps.push('Quality Checks');
            }

            await core.summary
              .addHeading('PR Validation Pipeline Summary')
              .addTable([
                [{data: 'Step', header: true}, {data: 'Status', header: true}],
                ['1️⃣ Authorization', results.authorization.status === 'success' ? '✅ Passed' : '❌ Failed'],
                ['2️⃣ PR Guardrails', results.guardrails.status === 'success' ? '✅ Passed' : results.guardrails.status === 'failure' ? '❌ Failed' : '⚠️ Skipped'],
                ['3️⃣ Quality Checks', results.qualityChecks.status === 'success' ? '✅ Passed' : results.qualityChecks.status === 'failure' ? '❌ Failed' : '⚠️ Skipped']
              ])
              .addRaw(`\n**Overall Status:** ${overallStatus}`)
              .addRaw(failedSteps.length > 0 ? `\n**Failed Steps:** ${failedSteps.join(', ')}` : '')
              .write();
