name: Claude Code Integration

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # Step 1: Check if user is authorized to use Claude Code
  authorize:
    name: "🔐 Authorization Check"
    runs-on: ubuntu-latest
    # Only run if @claude is mentioned
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude') || contains(github.event.pull_request.body, '@claude') || contains(github.event.review.body, '@claude')
    outputs:
      authorized: ${{ steps.check-auth.outputs.authorized }}
      reason: ${{ steps.check-auth.outputs.reason }}
      actor: ${{ steps.check-auth.outputs.actor }}
      association: ${{ steps.check-auth.outputs.association }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check authorization
        id: check-auth
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');

            // Get the actor (user who triggered this workflow)
            const actor = context.actor;
            console.log(`Checking authorization for user: ${actor}`);

            // Load authorization config
            let config;
            try {
              const configFile = fs.readFileSync('.github/claude-authorized-users.yml', 'utf8');
              config = yaml.load(configFile);
            } catch (error) {
              console.error('Failed to load authorization config:', error);
              core.setOutput('authorized', 'false');
              core.setOutput('reason', 'Authorization configuration file not found or invalid');
              core.setOutput('actor', actor);
              core.setOutput('association', 'UNKNOWN');
              return;
            }

            // Check emergency circuit breaker
            if (config.emergency && config.emergency.enabled === true) {
              const reason = config.emergency.reason || 'Emergency circuit breaker activated';
              console.log(`❌ Circuit breaker enabled: ${reason}`);
              core.setOutput('authorized', 'false');
              core.setOutput('reason', reason);
              core.setOutput('actor', actor);
              core.setOutput('association', 'BLOCKED_BY_CIRCUIT_BREAKER');

              // Post a comment explaining the circuit breaker
              if (context.payload.issue || context.payload.pull_request) {
                const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `🚨 **Claude Code Emergency Circuit Breaker Activated**\n\n` +
                        `Claude Code is temporarily disabled due to: ${reason}\n\n` +
                        `Contact: ${config.emergency.contact || 'repository administrators'}`
                });
              }
              return;
            }

            // Get user's association with the repository
            let association = 'NONE';
            let userPermission = 'none';

            try {
              // Get repository permission for user
              const { data: permissionData } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor
              });
              userPermission = permissionData.permission;

              // Get author association from the event
              association = context.payload.comment?.author_association ||
                           context.payload.issue?.author_association ||
                           context.payload.pull_request?.author_association ||
                           context.payload.review?.author_association ||
                           'NONE';

              console.log(`User association: ${association}`);
              console.log(`User permission: ${userPermission}`);
            } catch (error) {
              console.log(`Could not determine user association: ${error.message}`);
            }

            // Check if user is repository owner
            const isOwner = association === 'OWNER' || userPermission === 'admin';

            // Check if user is collaborator (write access or higher)
            const isCollaborator = ['write', 'maintain', 'admin'].includes(userPermission);

            // Check if user is org member
            const isMember = association === 'MEMBER';

            // Check if user is first-time contributor
            const isFirstTime = association === 'FIRST_TIME_CONTRIBUTOR';

            // Check if user is in explicit authorized list
            const isExplicitlyAuthorized = config.authorized_users &&
                                          config.authorized_users.includes(actor);

            console.log(`Authorization checks:`);
            console.log(`  - Is owner: ${isOwner}`);
            console.log(`  - Is collaborator: ${isCollaborator}`);
            console.log(`  - Is org member: ${isMember}`);
            console.log(`  - Is first-time: ${isFirstTime}`);
            console.log(`  - Explicitly authorized: ${isExplicitlyAuthorized}`);

            // Determine authorization
            let authorized = false;
            let reason = '';

            // Check explicit authorization list first
            if (isExplicitlyAuthorized) {
              authorized = true;
              reason = 'User is in authorized users list';
            }
            // Check owner
            else if (isOwner && config.settings?.allow_owner !== false) {
              authorized = true;
              reason = 'User is repository owner';
            }
            // Check collaborator
            else if (isCollaborator && config.settings?.allow_collaborators === true) {
              authorized = true;
              reason = 'User is repository collaborator';
            }
            // Check org member
            else if (isMember && config.settings?.allow_org_members === true) {
              authorized = true;
              reason = 'User is organization member';
            }
            // Check blocks
            else if (isFirstTime && config.settings?.block_first_time_contributors === true) {
              authorized = false;
              reason = 'First-time contributors are not authorized';
            }
            else if (association === 'NONE' && config.settings?.block_external_contributors === true) {
              authorized = false;
              reason = 'External contributors are not authorized';
            }
            else {
              authorized = false;
              reason = 'User does not meet authorization criteria';
            }

            // Log the decision
            if (config.audit?.log_attempts) {
              console.log(`\n${'='.repeat(60)}`);
              console.log(`Authorization Decision:`);
              console.log(`  User: ${actor}`);
              console.log(`  Association: ${association}`);
              console.log(`  Authorized: ${authorized}`);
              console.log(`  Reason: ${reason}`);
              console.log(`${'='.repeat(60)}\n`);
            }

            // Set outputs
            core.setOutput('authorized', authorized.toString());
            core.setOutput('reason', reason);
            core.setOutput('actor', actor);
            core.setOutput('association', association);

            // Create summary
            await core.summary
              .addHeading('🔐 Claude Code Authorization Check')
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['User', actor],
                ['Association', association],
                ['Authorized', authorized ? '✅ Yes' : '❌ No'],
                ['Reason', reason]
              ])
              .write();

  # Step 2: Run Claude Code (only if authorized)
  claude:
    name: "🤖 Claude Code"
    runs-on: ubuntu-latest
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'

    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better context

      - name: Log authorized access
        run: |
          echo "✅ Claude Code authorized for user: ${{ needs.authorize.outputs.actor }}"
          echo "   Association: ${{ needs.authorize.outputs.association }}"
          echo "   Reason: ${{ needs.authorize.outputs.reason }}"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        continue-on-error: true  # Don't fail workflow if Claude Code encounters issues
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read

      - name: Log completion
        if: always()
        run: |
          echo "Claude Code execution completed"
          echo "Check the PR/issue for Claude's response"

  # Notify if authorization failed
  notify-unauthorized:
    name: "🚫 Unauthorized Attempt"
    runs-on: ubuntu-latest
    needs: authorize
    if: needs.authorize.outputs.authorized == 'false'

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Log unauthorized attempt
        run: |
          echo "❌ Unauthorized Claude Code attempt"
          echo "   User: ${{ needs.authorize.outputs.actor }}"
          echo "   Association: ${{ needs.authorize.outputs.association }}"
          echo "   Reason: ${{ needs.authorize.outputs.reason }}"

      - name: Post unauthorized notification
        uses: actions/github-script@v7
        with:
          script: |
            const actor = '${{ needs.authorize.outputs.actor }}';
            const association = '${{ needs.authorize.outputs.association }}';
            const reason = '${{ needs.authorize.outputs.reason }}';

            // Only post comment if there's an issue or PR
            if (context.payload.issue || context.payload.pull_request) {
              const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `🚫 **Claude Code Authorization Failed**\n\n` +
                      `@${actor}, you are not authorized to use Claude Code in this repository.\n\n` +
                      `**Reason:** ${reason}\n\n` +
                      `**Your association:** ${association}\n\n` +
                      `If you believe this is an error, please contact the repository administrators.\n\n` +
                      `---\n` +
                      `*To request access, see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for guidelines.*`
              });
            }
