<!DOCTYPE html>
<!--
  PROTÓTIPO CLICÁVEL — GazetaMarketplace (auxílio de aprovação, nível de intenção)

  * DESCARTÁVEL: serve apenas para o Product Owner clicar pelas telas e aprovar o desenho.
    Depois da aprovação pode ser apagado ou guardado como retrato desta versão. NÃO é mantido
    em dia com mudanças de requisitos e NÃO é o produto.
  * FONTE DA VERDADE: os wireframes em ASCII (specs/wireframes/screens/*.md) e a SPEC (specs/SPEC.md).
    Em caso de diferença, vale o ASCII.
  * Sem backend: todos os dados são fictícios e ficam na memória da aba (sessionStorage).
    Só os favoritos usam localStorage (apenas os números dos anúncios), como pede a US-005.
  * Autocontido: CSS e JavaScript embutidos, sem CDN, sem fontes, sem imagens remotas. Abre offline.
  * Não define a paleta, os componentes nem os tokens oficiais do produto: isso é da etapa de arquitetura.
    Os valores --pt-* abaixo são neutros e servem só para o desenho ficar legível.
  * As etiquetas @US-xxx-Snn (botão "Mostrar tags @US") usam os IDs reais dos cenários da SPEC.
  * CEP: a busca é SIMULADA com o dicionário local CEP_MOCK (funciona offline). Só 01310-100, 20040-020 e
    30130-010 foram dados pelo Product Owner; os demais CEPs são fictícios, não conferidos com os Correios.
    No site real, o SERVIDOR consulta o ViaCEP (ou similar) e devolve Cidade/UF; o navegador não chama o
    serviço externo. Cidade e UF vêm do CEP e não são digitadas. O CEP aparece só no painel (suposição S25).
  * Preço: máscara estilo banco (os dígitos entram pelos centavos; S28). O formulário guarda centavos inteiros
    (priceCents); o anúncio salvo no protótipo guarda reais, para não mexer em busca e ordenação. Guardar em
    centavos no banco é decisão do /arch.
  * CEP fora do ar (US-008-S14, NFR-24): marque "Simular CEP fora do ar" na barra. Tempos encurtados: 1 s aqui
    representa os 5 s reais de cada tentativa. CEP já encontrado vem do cache (cepCache), sem nova busca.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GazetaMarketplace — Protótipo clicável (aprovação)</title>
<style>
*{box-sizing:border-box}
:root{
  /* valores NEUTROS do protótipo (não são os tokens do produto) */
  --pt-bg:#eef1f5;--pt-paper:#fff;--pt-text:#1a2233;--pt-muted:#4a5568;--pt-line:#cbd5e1;--pt-field:#64748b;
  --pt-accent:#1d4ed8;--pt-accent-d:#1e40af;--pt-danger:#b42318;--pt-danger-bg:#fef3f2;--pt-danger-tx:#7a1710;
  --pt-ok:#0b6b3a;--pt-ok-bg:#e8f6ee;--pt-ok-tx:#0b4a2b;--pt-warn-bg:#fff4d6;--pt-warn-tx:#5e3a00;--pt-info-bg:#e7f0ff;--pt-info-tx:#17407f;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#d9dde4;color:var(--pt-text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
:focus-visible{outline:3px solid #111;outline-offset:2px;box-shadow:0 0 0 2px #fff}
a{color:var(--pt-accent)}
h1,h2,h3{line-height:1.25;margin:0 0 8px}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3,.h3{font-size:1.05rem;margin:0 0 6px}
p{margin:0 0 10px}
img,svg{max-width:100%}

/* ===== barra do protótipo (visualmente distinta do produto) ===== */
.protobar{position:sticky;top:0;z-index:100;background:#2b1055;color:#fff;font-size:13px;border-bottom:3px solid #ffd84d}
.protobar .strip{background:#ffd84d;color:#1a1200;text-align:center;font-weight:700;padding:4px 8px}
.protobar .ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px}
.protobar .brand{font-size:13px}
.protobar label{display:flex;align-items:center;gap:6px}
.protobar select,.protobar button,.protobar summary{font:inherit;font-size:13px;border-radius:6px;border:1px solid #8a78c4;background:#3c2278;color:#fff;padding:4px 8px;min-height:32px;cursor:pointer;width:auto}
.protobar select{max-width:260px}
.protobar button[aria-pressed=true]{background:#ffd84d;color:#1a1200;border-color:#ffd84d;font-weight:700}
.protobar .grp{display:inline-flex;gap:0}
.protobar .grp button:first-child{border-radius:6px 0 0 6px}.protobar .grp button:last-child{border-radius:0 6px 6px 0}
.protobar :focus-visible{outline-color:#fff;box-shadow:0 0 0 2px #2b1055}
.protobar .scn{position:relative}
.protobar .scn-b{position:absolute;top:calc(100% + 4px);left:0;background:#3c2278;border:1px solid #8a78c4;border-radius:8px;padding:10px;z-index:120;min-width:300px;display:grid;gap:8px}
.protobar .scn-b label{align-items:flex-start}
.protobar .scn-b input{width:auto;min-height:0;margin-top:3px}
.protobar .tstat{color:#ffd84d;font-weight:600}
.protobar .hint2{color:#d9d0f5;font-size:12px}
@media (max-width:700px){.protobar{position:static}}

.stage{display:flex;justify-content:center;padding:16px 8px 40px}
#app{container:app/inline-size;width:100%;max-width:1000px;position:relative;background:var(--pt-bg);border:1px solid #9aa4b2;border-radius:8px;overflow-x:clip;min-height:70vh}
body.mobile #app{max-width:320px;box-shadow:0 0 0 8px #1c1c28;border-radius:22px;border-color:#1c1c28}
.ribbon{background:#ffd84d;color:#1a1200;font-size:12px;font-weight:700;text-align:center;padding:3px 8px}
.skip{position:absolute;left:8px;top:-80px;background:#fff;padding:8px 12px;border-radius:6px;z-index:60;font-weight:700}
.skip:focus{top:30px}
main{display:block;padding:16px;outline:none}
main:focus,[tabindex="-1"]:focus{outline:none}
main:focus-visible{outline:none;box-shadow:none}

/* ===== botões, campos, alertas ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:8px;border:2px solid var(--pt-accent);background:var(--pt-accent);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center}
.btn:hover{background:var(--pt-accent-d);border-color:var(--pt-accent-d)}
.btn.sec{background:#fff;color:var(--pt-accent)}
.btn.sec:hover{background:#eef4ff}
.btn.danger{background:var(--pt-danger);border-color:var(--pt-danger)}
.btn.wa{background:var(--pt-ok);border-color:var(--pt-ok)}
.btn.block{width:100%}
.btn[disabled],.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{font:inherit;color:inherit;width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--pt-field);border-radius:8px;background:#fff}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
textarea{min-height:96px;resize:vertical}
input:disabled,select:disabled{background:#eceff3;color:#4a5568}
input[readonly]{background:#eceff3;color:#1a202c}
.cep-row{display:flex;align-items:center;gap:10px}
.selo{display:inline-block;background:var(--pt-warn-bg);color:var(--pt-warn-tx);border:1px solid #efd08a;border-radius:999px;padding:2px 10px;font-size:.875rem;font-weight:600}.selo-wrap{margin:8px 0}.cep-row input{max-width:12rem}
[aria-invalid=true]{border:2px solid var(--pt-danger)}
.hint{color:var(--pt-muted);font-size:.875rem}
.err{color:var(--pt-danger);font-weight:600;font-size:.9rem;margin-top:4px}
.err:empty{display:none}
.err:not(:empty)::before{content:"! "}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:1px solid var(--pt-line);border-radius:8px;padding:8px 12px 12px;margin:14px 0 0;min-width:0}
legend{font-weight:700;padding:0 6px}
.radios{display:flex;gap:18px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:8px;font-weight:400;margin:6px 0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;border:1px solid;margin:12px 0}
.alert p{margin:0 0 6px}.alert p:last-child{margin:0}.alert ul{margin:6px 0 0;padding-left:20px}
.alert .ic{flex:0 0 22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;border:2px solid currentColor;line-height:1}
.alert .ic::after{content:attr(data-c)}
.alert.error{background:var(--pt-danger-bg);border-color:#f0b4ad;color:var(--pt-danger-tx)}
.alert.info{background:var(--pt-info-bg);border-color:#b9d0f5;color:var(--pt-info-tx)}
.alert.ok{background:var(--pt-ok-bg);border-color:#a9dcbf;color:var(--pt-ok-tx)}
.alert.warn{background:var(--pt-warn-bg);border-color:#efd08a;color:var(--pt-warn-tx)}
.alert a{color:inherit;font-weight:700}
.empty{background:#fff;border:2px dashed var(--pt-line);border-radius:10px;padding:28px 16px;text-align:center;color:var(--pt-muted)}
.empty .btn{margin-top:8px}
.card{background:#fff;border:1px solid var(--pt-line);border-radius:10px;padding:16px;margin-bottom:14px}
.proto-box{border:2px dashed #7c5cc4;background:#f4efff;color:#2b1055;border-radius:8px;padding:10px 12px;margin:14px 0;font-size:.875rem}
.proto-box strong.t{display:block;margin-bottom:4px}
.proto-box .btn{min-height:36px;padding:4px 10px;font-size:.85rem;margin:2px 4px 2px 0}
.proto-box table{border-collapse:collapse;width:100%}
.proto-box td,.proto-box th{padding:2px 6px 2px 0;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.us{display:none;background:#ecfeff;border:1px solid #67b8cc;color:#0b5566;border-radius:5px;font-size:10px;line-height:1.3;padding:0 5px;margin:0 2px;font-weight:700;font-style:normal;max-width:100%;overflow-wrap:anywhere;vertical-align:middle;white-space:normal}
body.show-us .us{display:inline-block}
.sk{background:linear-gradient(90deg,#dfe4ea,#f1f4f7,#dfe4ea);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:6px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

/* ===== site público ===== */
.site-h{background:#fff;border-bottom:1px solid var(--pt-line);padding:12px 16px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"logo fav" "search search";gap:10px}
.logo{grid-area:logo;font-weight:800;font-size:1.2rem;color:var(--pt-accent);text-decoration:none;align-self:center}
.favlink{grid-area:fav;text-decoration:none;font-weight:700;color:var(--pt-danger);align-self:center;min-height:44px;display:inline-flex;align-items:center;gap:4px}
.search{grid-area:search;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search input{flex:1;min-width:0}
.site-f{padding:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--pt-muted);border-top:1px solid var(--pt-line);background:#fff;font-size:.9rem}
.site-f a{color:var(--pt-muted);display:inline-flex;align-items:center;min-height:44px}
.crumbs{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:2px 0;font-size:.9rem}
.crumbs li+li::before{content:">";margin:0 8px;color:var(--pt-muted)}
.crumbs li[aria-current]{color:var(--pt-muted)}
.cats,.chips{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap}
.chips a{display:inline-flex;align-items:center;min-height:44px;padding:6px 14px;border:1px solid var(--pt-accent);border-radius:999px;background:#fff;text-decoration:none;font-weight:600}
.catcard{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px;background:#fff;border:1px solid var(--pt-line);border-radius:10px;text-decoration:none;color:var(--pt-text);font-weight:700}
.catcard:hover{border-color:var(--pt-accent)}
.cico{flex:0 0 36px;height:36px;border-radius:8px;background:hsl(var(--h) 45% 32%);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;list-style:none;padding:0;margin:0 0 16px}
.ad{position:relative;background:#fff;border:1px solid var(--pt-line);border-radius:10px;overflow:hidden;height:100%}
.ad-link{display:block;color:inherit;text-decoration:none}
.ad-link:hover .ad-t{text-decoration:underline}
.ph-w{display:block;aspect-ratio:4/3;background:#1a2233}
.ph{display:block;width:100%;height:100%}
.ad-t{display:block;padding:8px 10px 0;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.ad-p{display:block;padding:2px 10px;font-weight:800;font-size:1.1rem}
.ad-c{display:flex;align-items:center;min-height:48px;padding:0 54px 4px 10px;color:var(--pt-muted);font-size:.9rem}
.heart{position:absolute;right:2px;bottom:2px;width:44px;height:44px;border-radius:50%;border:0;background:transparent;font-size:1.5rem;color:var(--pt-danger);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;min-height:44px}
.heart:hover{background:#fdecea}
.ad.rmv .ad-c{padding-right:10px;min-height:0;padding-bottom:6px}
.ad.rmv .rm{margin:0 10px 10px;width:calc(100% - 20px)}
.ad-us{padding:0 6px 4px}
.tot{font-weight:700}
.det{display:grid;gap:16px;margin-bottom:16px}
.det>*{min-width:0}
.gal-stage{position:relative}
.gal-main{display:block;width:100%;aspect-ratio:4/3;padding:0;border:0;background:#1a2233;border-radius:10px;overflow:hidden;cursor:zoom-in}
.gal-broken{display:flex;align-items:center;justify-content:center;background:#e2e8f0;color:#1a2233;font-weight:700;border:2px dashed var(--pt-field);cursor:default}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:rgba(15,23,42,.85);color:#fff;font-size:1.1rem;cursor:pointer;padding:0;min-height:44px}
.gal-nav.p{left:8px}.gal-nav.n{right:8px}
.gal-count{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.88);color:#fff;border-radius:999px;padding:1px 12px;font-size:.85rem}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin:0;list-style:none;max-width:100%}
.thumbs li{flex:0 0 72px}
.thumbs button{display:block;width:72px;height:54px;padding:0;border:3px solid transparent;border-radius:6px;overflow:hidden;background:#1a2233;cursor:pointer;min-height:0;color:#fff;font-weight:800}
.thumbs button[aria-current=true]{border-color:var(--pt-accent)}
.ad-title{overflow-wrap:anywhere}
.price{font-size:1.6rem;font-weight:800;margin:0 0 4px}
.meta{color:var(--pt-muted);margin:0 0 4px}
.contact{margin-top:12px;background:#f6faff;border-color:#b9d0f5}
.phone{font-size:1.4rem;font-weight:800;margin:0 0 10px}
.cbtns{display:grid;gap:8px}
.favbtn{margin-top:8px;width:100%}
.txt{white-space:pre-line;overflow-wrap:anywhere}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:0}
.specs dt{color:var(--pt-muted);font-size:.85rem}.specs dd{margin:0;font-weight:700}
.srch{display:grid;gap:16px}
.srch>*{min-width:0}
.filters{margin:0}
.ftoggle{display:none;width:100%}
.res-h{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.res-h label{display:flex;align-items:center;gap:8px;margin:0;font-weight:600}
.res-h select{width:auto}
.pager{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:8px 0 16px;justify-content:center}
.pg{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:4px 12px;border:1px solid var(--pt-line);border-radius:8px;background:#fff;text-decoration:none;font-weight:600;font:inherit;color:var(--pt-accent);cursor:pointer}
.pg.cur{background:var(--pt-accent);color:#fff;border-color:var(--pt-accent)}
.pg.dis{color:#5b6472;background:#eceff3;cursor:not-allowed}
.results .grid{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ===== acesso da equipe ===== */
.auth-h{background:#fff;border-bottom:1px solid var(--pt-line);padding:12px 16px;font-weight:800}
.auth-h a{text-decoration:none}
.auth-card{max-width:440px;margin:16px auto}
.auth-card .btn.block{margin-top:14px}

/* ===== painel ===== */
.pan-h{background:#1e293b;color:#fff;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.pan-brand{font-weight:800}
.pan-nav{display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap}
.pan-nav ul{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex-wrap:wrap}
.pan-nav a{display:inline-flex;align-items:center;min-height:44px;padding:6px 12px;border-radius:6px;color:#fff;text-decoration:none;font-weight:600}
.pan-nav a:hover{background:#334155}
.pan-nav a[aria-current=page]{background:#fff;color:#1e293b;font-weight:800}
.pan-user{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pan-h :focus-visible{outline-color:#fff;box-shadow:0 0 0 2px #1e293b}
.pan-h .btn.sec{background:transparent;color:#fff;border-color:#fff}
.menu-btn{display:none}
.back{display:inline-flex;align-items:center;min-height:44px;margin-bottom:4px}
.pt{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:8px}
.pt h1{margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;padding:0;list-style:none}
.tabs a{display:inline-flex;align-items:center;min-height:44px;padding:6px 14px;border:1px solid var(--pt-line);border-radius:8px;background:#fff;text-decoration:none;font-weight:600}
.tabs a[aria-current=page]{background:var(--pt-accent);color:#fff;border-color:var(--pt-accent)}
.filt{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--pt-line)}
.tbl th,.tbl td{padding:10px;text-align:left;border-bottom:1px solid var(--pt-line);vertical-align:top}
.tbl th{background:#f1f5f9;font-size:.85rem}
.tbl a{font-weight:700}
.reason{color:var(--pt-danger-tx);font-size:.875rem;margin-top:4px}
.cards-list{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:10px}
.cards-list li{background:#fff;border:1px solid var(--pt-line);border-radius:10px;padding:12px}
.cards-list .k{color:var(--pt-muted);font-size:.85rem}
.only-narrow{display:none}
.st{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.8rem;font-weight:700;border:1px solid;white-space:nowrap}
.st-draft{background:#e2e8f0;color:#1e293b;border-color:#94a3b8}
.st-review{background:var(--pt-warn-bg);color:var(--pt-warn-tx);border-color:#e0b95a}
.st-published{background:var(--pt-ok-bg);color:var(--pt-ok-tx);border-color:#7fc39a}
.st-rejected{background:var(--pt-danger-bg);color:var(--pt-danger-tx);border-color:#e58f86}
.st-archived{background:#f1f5f9;color:#334155;border:1px dashed #64748b}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.prev-frame{border:2px dashed var(--pt-line);border-radius:10px;padding:12px;background:#fff;margin-top:8px}
.ptiles{list-style:none;margin:8px 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ptile{background:#fff;border:1px solid var(--pt-line);border-radius:10px;padding:8px;display:grid;gap:6px;align-content:start}
.pimg{position:relative;aspect-ratio:4/3;background:#1a2233;border-radius:6px;overflow:hidden}
.pov{position:absolute;inset:0;background:rgba(15,23,42,.82);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:700;font-size:.85rem;padding:6px}
.pov.fail{background:#7a1710}
.bar{width:80%;height:8px;border-radius:4px;background:#475569;overflow:hidden}.bar i{display:block;height:100%;width:60%;background:#ffd84d}
.capa{display:inline-block;font-weight:800;font-size:.8rem;color:var(--pt-ok-tx);background:var(--pt-ok-bg);border:1px solid #7fc39a;border-radius:4px;padding:1px 8px;justify-self:start}
.ptile .btn{min-height:40px;padding:4px 8px;font-size:.85rem}
.pbar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.formfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.ficha{margin-top:14px}
.prov{display:inline-block;font-size:.75rem;font-weight:600;background:var(--pt-warn-bg);color:var(--pt-warn-tx);border:1px solid #efd08a;border-radius:999px;padding:1px 8px;vertical-align:middle}
.ph-none{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#e2e8f0;color:var(--pt-text);font-weight:700;text-align:center;padding:8px}

/* ---- busca ---- */
function parseFilters(q){const g=k=>q[k]||'';return {q:g('q'),cat:g('cat'),uf:g('uf'),city:g('city'),pmin:g('pmin'),pmax:g('pmax'),brand:g('brand'),model:g('model'),ymin:g('ymin'),ymax:g('ymax'),kmax:g('kmax'),amin:g('amin'),amax:g('amax'),sort:g('sort')||'recent',page:Math.max(1,parseInt(q.page||'1',10)||1)};}
function searchAds(f){
  let l=published();
  if(f.q){const t=norm(f.q);l=l.filter(a=>norm(a.title+' '+a.desc).indexOf(t)>=0);}
  if(f.cat){const ids=descIds(f.cat);l=l.filter(a=>ids.indexOf(a.cat)>=0);}
  if(f.uf)l=l.filter(a=>a.uf===f.uf);if(f.city)l=l.filter(a=>a.city===f.city);
  /* Provisório (A6): Serviços não têm preço — ficam fora da faixa de preço e no fim da ordenação por preço */
  if(f.pmin!=='')l=l.filter(a=>hasPrice(a.cat)&&a.price>=+f.pmin);if(f.pmax!=='')l=l.filter(a=>hasPrice(a.cat)&&a.price<=+f.pmax);
  const fi=f.cat?catFicha(f.cat):null;
  if(fi==='vehicle'){if(f.brand)l=l.filter(a=>a.brand===f.brand);if(f.model)l=l.filter(a=>norm(a.model).indexOf(norm(f.model))>=0);if(f.ymin!=='')l=l.filter(a=>+a.year>=+f.ymin);if(f.ymax!=='')l=l.filter(a=>+a.year<=+f.ymax);if(f.kmax!=='')l=l.filter(a=>+a.km<=+f.kmax);}
  if(fi==='land'){if(f.amin!=='')l=l.filter(a=>+a.area>=+f.amin);if(f.amax!=='')l=l.filter(a=>+a.area<=+f.amax);}
  const np=a=>hasPrice(a.cat)?0:1;
  if(f.sort==='price_asc')l.sort((a,b)=>np(a)-np(b)||a.price-b.price||byRecent(a,b));else if(f.sort==='price_desc')l.sort((a,b)=>np(a)-np(b)||b.price-a.price||byRecent(a,b));else l.sort(byRecent);
  return l;
}
const searchHref=(f,over)=>{const o=Object.assign({},f,over||{});if(o.sort==='recent')o.sort='';if(o.page===1)o.page='';return '#/busca?'+Object.keys(o).filter(k=>o[k]!==''&&o[k]!=null).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(o[k])).join('&');};
function filtersHtml(f){
  const fi=f.cat?catFicha(f.cat):null,brands=Array.from(new Set(published().filter(a=>a.brand).map(a=>a.brand))).sort();

  '<div class="fbody" id="fbody"><h2 class="h3">Filtros</h2>'+
  '<label for="s-cat">Categoria</label><select id="s-cat">'+catOptions(f.cat,'search','Todas as categorias')+'</select>'+us('US-002-S02')+
  '<label for="s-uf">UF</label><select id="s-uf">'+ufOptions(f.uf,'Todas as UFs')+'</select>'+us('US-002-S02','US-002-S10')+
  '<label for="s-city">Cidade</label><select id="s-city"'+(f.uf?'':' disabled')+'>'+cityOptions(f.uf,f.city,'Todas as cidades')+'</select>'+
  '<fieldset><legend>Preço (R$)</legend><div class="row2 keep"><div><label for="s-pmin">Preço mínimo (R$)</label><input id="s-pmin" type="number" min="0" inputmode="numeric" value="'+esc(f.pmin)+'" aria-describedby="e-price"></div><div><label for="s-pmax">Preço máximo (R$)</label><input id="s-pmax" type="number" min="0" inputmode="numeric" value="'+esc(f.pmax)+'" aria-describedby="e-price"></div></div><div class="err" id="e-price" role="alert"></div><p class="hint">Serviços não têm preço: ficam fora da faixa de preço e no fim da ordenação por preço <span class="prov">provisório (A6)</span></p>'+us('US-002-S02','US-002-S08')+'</fieldset>'+
  '<div data-only="vehicle"'+(fi==='vehicle'?'':' hidden')+'><fieldset><legend>Veículo</legend><label for="s-brand">Marca</label><select id="s-brand"><option value="">Todas as marcas</option>'+brands.map(b=>'<option'+(f.brand===b?' selected':'')+'>'+esc(b)+'</option>').join('')+'</select>'+
  '<label for="s-model">Modelo</label><input id="s-model" type="text" value="'+esc(f.model)+'"><div class="row2 keep"><div><label for="s-ymin">Ano de</label><input id="s-ymin" type="number" inputmode="numeric" value="'+esc(f.ymin)+'"></div><div><label for="s-ymax">Ano até</label><input id="s-ymax" type="number" inputmode="numeric" value="'+esc(f.ymax)+'"></div></div>'+
  '<label for="s-kmax">Quilometragem máxima (km)</label><input id="s-kmax" type="number" min="0" inputmode="numeric" value="'+esc(f.kmax)+'">'+us('US-002-S03')+'</fieldset></div>'+
  '<div data-only="land"'+(fi==='land'?'':' hidden')+'><fieldset><legend>Terreno</legend><div class="row2 keep"><div><label for="s-amin">Área mínima (m²)</label><input id="s-amin" type="number" min="0" inputmode="numeric" value="'+esc(f.amin)+'"></div><div><label for="s-amax">Área máxima (m²)</label><input id="s-amax" type="number" min="0" inputmode="numeric" value="'+esc(f.amax)+'"></div></div>'+us('US-002-S04')+'</fieldset></div>'+
  '<div class="actions"><button type="submit" class="btn">Aplicar filtros</button><button type="button" class="btn sec" data-act="clearfilters">Limpar filtros</button></div><p class="hint" role="status" id="filt-live" aria-live="polite"></p></div></form>';
}
function searchPage(q){
  const f=parseFilters(q),st=S.view.state;
  const cr=[{l:'Início',h:'#/'}];
  if(f.cat){const c=cat(f.cat);if(c){if(c.parent)cr.push({l:catName(c.parent),h:'#/categoria/'+c.parent});cr.push({l:c.name});}}else cr.push({l:'Busca'});
  let res;
  if(st==='error')res=errBlock('search');
  else if(st==='loading')res=skGrid(24);
  else{
    let list=searchAds(f);if(st==='empty'||st==='noresult')list=[];
    const pages=Math.max(1,Math.ceil(list.length/24)),cur=Math.min(f.page,pages),slice=list.slice((cur-1)*24,cur*24);
    const sortSel='<label>Ordenar por <select id="s-sort" data-fk="s-sort"><option value="recent"'+(f.sort==='recent'?' selected':'')+'>Mais recentes</option><option value="price_asc"'+(f.sort==='price_asc'?' selected':'')+'>Menor preço</option><option value="price_desc"'+(f.sort==='price_desc'?' selected':'')+'>Maior preço</option></select></label>'+us('US-002-S05');
    if(!list.length)res='<div class="res-h"><p class="tot" role="status">0 anúncios encontrados</p>'+sortSel+'</div><p class="empty" role="status">Nenhum anúncio encontrado para esses filtros</p><p style="text-align:center"><button type="button" class="btn" data-act="clearfilters">Limpar filtros</button> '+us('US-002-S07')+'</p>';
    else res='<div class="res-h"><p class="tot" role="status">'+(list.length===1?'1 anúncio encontrado':list.length+' anúncios encontrados')+' '+us('US-002-S01','US-002-S06')+'</p>'+sortSel+'</div>'+adGrid(slice,{t:['US-003-S01','US-005-S01']})+pager(cur,pages,p=>searchHref(f,{page:p}))+us('US-002-S06');
  }
  const inner=crumbs(cr)+'<h1 class="sr">Resultados da busca</h1><div class="srch">'+filtersHtml(f)+'<section class="results" aria-label="Resultados" aria-busy="'+(st==='loading')+'">'+res+'</section></div>';
  return {html:pubLayout(inner,{q:f.q}),title:'Busca',states:['empty','noresult','error','loading'],after:()=>{if(S.filtersOpen){$('#filters').classList.add('open');}}};
}

function pendencies(f){

  const fi=f.cat?catFicha(f.cat):null,mx=maxPhotos(f.cat),okP=f.photos.filter(x=>!x.failed&&!x.uploading).length;
  if(mx&&!okP)p.push({t:'photos-h',m:'Adicione ao menos 1 foto'});

  if(fi==='land'&&!(+f.area>0))p.push({t:'f-area',m:'Informe a área'});

function parseHash(){
  const h=location.hash.replace(/^#/,'')||'/';const i=h.indexOf('?');const p=i<0?h:h.slice(0,i),qs=i<0?'':h.slice(i+1);
  const parts=p.split('/').filter(Boolean).map(x=>{try{return decodeURIComponent(x);}catch(e){return x;}});const query={};
  qs.split('&').forEach(kv=>{if(!kv)return;const j=kv.indexOf('=');const k=j<0?kv:kv.slice(0,j),v=j<0?'':kv.slice(j+1);try{query[decodeURIComponent(k)]=decodeURIComponent(v.replace(/\+/g,' '));}catch(e){query[k]=v;}});
  return {parts:parts,query:query};
}
function go(h){if(location.hash===h){render({focus:true});if(S.flash)S.flash.keep=false;}else location.hash=h;}
function panelRoute(r){
  const u=me();
  if(!u){S.returnTo=location.hash;history.replaceState(null,'','#/equipe/entrar');S.view.state='normal';return loginPage();}
  const [,b,c,d]=r.parts,adm=u.role==='admin';
  if(b==='fila'||b==='categorias'||b==='usuarios'||b==='configuracoes'){
    if(!adm)return deniedPage('page');
    return b==='fila'?filaPage():b==='categorias'?catsPage():b==='usuarios'?usersPage():settingsPage();
  }
  if(b==='anuncios'||!b){
    if(!c)return listPage();
    if(c==='novo')return formPage('new');
    const ad=findAd(+c);
    if(!ad||(!adm&&ad.author!==u.id))return deniedPage('ad');
    if(d==='editar'){if(ad.status==='archived'||(!adm&&ad.status!=='draft'&&ad.status!=='rejected'))return viewPage(ad);return formPage(String(ad.id));}
    if((ad.status==='draft'||ad.status==='rejected'))return formPage(String(ad.id));
    return viewPage(ad);
  }
  return deniedPage('page');
}
function routeView(r){
  const a=r.parts[0],b=r.parts[1];
  if(!a)return homePage();
  if(a==='categoria')return categoryPage(b);
  if(a==='busca')return searchPage(r.query);
  if(a==='anuncio')return detailPage(b);
  if(a==='favoritos')return favPage();
  if(a==='equipe'){
    if(b==='entrar'){if(me()){return {redirect:landing(me())};}return loginPage();}
    if(b==='senha-nova')return newPwdPage();
    if(b==='esqueci')return forgotPage();
    if(b==='redefinir')return resetPage(r.query);
  }
  if(a==='painel')return panelRoute(r);
  return {html:pubLayout('<h1 data-autofocus tabindex="-1">Página não encontrada</h1><p><a href="#/">Voltar para a página inicial</a></p>'),title:'Página não encontrada',states:[]};
}
const app=$('#app');
function render(opts){
  opts=opts||{};
  const keepY=opts.keep?window.scrollY:null;
  const ae=document.activeElement,fk=opts.keep&&ae&&ae.dataset?ae.dataset.fk:null;
  if(S.form&&$('#adform'))syncForm();
  const r=parseHash();
  let pg;
  try{pg=routeView(r);if(pg.redirect){history.replaceState(null,'',pg.redirect);pg=routeView(parseHash());}}
  catch(err){console.error(err);pg={html:'<main id="main" tabindex="-1"><div class="alert error" role="alert">Erro interno do protótipo.</div></main>',title:'Erro',states:[]};}
  if(pg.html.indexOf('id="adform"')<0)S.form=null;
  app.innerHTML=pg.html;
  document.title=(pg.title?pg.title+' — ':'')+'Protótipo GazetaMarketplace';
  persist();syncToolbar();
  if(pg.after)pg.after();
  if(S.view.state!=='normal'&&pg.states&&pg.states.indexOf(S.view.state)<0)pstat('O estado “'+STATE_LABEL[S.view.state]+'” não se aplica a esta tela.');
  if(keepY!=null)window.scrollTo(0,keepY);
  if(fk){const el=app.querySelector('[data-fk="'+fk+'"]');if(el)el.focus({preventScroll:true});}
  else if(opts.focus){const m=$('#main');const t=(m&&m.querySelector('[data-autofocus]'))||m;if(t)t.focus({preventScroll:true});window.scrollTo(0,0);}
}

function openDialog(o){
  const opener=document.activeElement,id='dlg'+(++dn);
  const d=document.createElement('dialog');d.className='dlg'+(o.big?' big':'');d.setAttribute('role',o.role||'dialog');d.setAttribute('aria-labelledby',id+'t');d.setAttribute('aria-describedby',id+'d');
  d.innerHTML='<form class="dlg-form" novalidate><div class="dlg-h"><h2 id="'+id+'t">'+o.title+'</h2></div><div class="dlg-b" id="'+id+'d">'+o.html+'</div><div class="dlg-f">'+o.actions.map(a=>'<button type="'+(a.key==='ok'?'submit':'button')+'" class="btn '+(a.cls||'')+'" data-k="'+a.key+'"'+(a.autofocus?' autofocus':'')+'>'+a.label+'</button>').join('')+'</div></form>';
  $('#dlg-root').appendChild(d);
  const form=d.querySelector('form');
  form.addEventListener('submit',e=>{e.preventDefault();const b=form.querySelector('[data-k=ok]');if(b&&!b.disabled)o.on('ok',d,b);});
  d.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b&&b.dataset.k!=='ok')o.on(b.dataset.k,d,b);});
  let done=false;
  const cleanup=()=>{if(done)return;done=true;d.remove();const t=(opener&&opener!==document.body&&document.contains(opener))?opener:$('#main');if(t&&t.focus)t.focus();if(o.onClose)o.onClose();};
  const nativeClose=d.close.bind(d);
  d.close=()=>{nativeClose();cleanup();};      /* fechar por botão limpa na hora */
  d.addEventListener('close',cleanup);          /* Esc (fechamento nativo) também limpa e devolve o foco */
  d.showModal();if(o.onOpen)o.onOpen(d);return d;
}
function confirmDlg(o){
  return openDialog({title:o.title,role:'alertdialog',html:'<p>'+o.text+'</p>',actions:[{key:'cancel',label:'Cancelar',cls:'sec',autofocus:true},{key:'ok',label:o.ok,cls:o.danger?'danger':''}],
    on:(k,d,b)=>{if(k==='cancel')d.close();else if(k==='ok')o.onOk(d,b);}});
}

function moveCat(id,dir){
  const c=cat(id),sibs=S.d.cats.filter(x=>x.parent===c.parent),i=sibs.indexOf(c),j=i+dir;
  if(j<0||j>=sibs.length){announce(dir<0?'Já é o primeiro do grupo':'Já é o último do grupo');return;}
  const o=sibs[j],ia=S.d.cats.indexOf(c),ib=S.d.cats.indexOf(o);S.d.cats[ia]=o;S.d.cats[ib]=c;persist();
  render({keep:true});announce(dir<0?c.name+' agora está antes de '+o.name:c.name+' agora está depois de '+o.name);
}
function catDialog(id){

document.addEventListener('click',e=>{
  /* sessão expirada: o próximo clique dentro do painel leva à entrada (US-006-S08) */
  if(S.flags.expire&&S.session.userId&&e.target.closest('.pan')){
    e.preventDefault();e.stopPropagation();S.flags.expire=false;S.session.userId=null;S.form=null;
    S.flash={kind:'info',html:'Sua sessão expirou. Entre novamente.',keep:true};go('#/equipe/entrar');return;
  }
  const el=e.target.closest('[data-act]');if(!el||!app.contains(el))return;
  const act=A[el.dataset.act];if(!act)return;
  if(el.tagName==='A')e.preventDefault();
  if(el.getAttribute('aria-disabled')==='true'&&(el.dataset.act==='catup'||el.dataset.act==='catdown')){announce(el.dataset.act==='catup'?'Já é o primeiro do grupo':'Já é o último do grupo');return;}
  act(el,e);
},true);
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f||!app.contains(f))return;e.preventDefault();
  const n=f.dataset.form;
  if(n==='search'){const q=$('#q').value.trim();go('#/busca'+(q?'?q='+encodeURIComponent(q):''));}
  else if(n==='filters')applyFilters();
  else if(n==='login')doLogin(f);
  else if(n==='newpwd')doNewPwd(f);
  else if(n==='forgot')doForgot(f);
  else if(n==='reset')doReset(f);
  else if(n==='settings')doSettings(f);
  else if(n==='adform')A.save();
});
function applyFilters(){
  clearErrs($('#filters'));
  const g=id=>{const e=$('#'+id);return e?e.value.trim():'';};
  const pmin=g('s-pmin'),pmax=g('s-pmax');
  if(pmin!==''&&pmax!==''&&+pmin>+pmax){setErr('s-pmin','');const er=$('#e-price');er.textContent='O preço mínimo não pode ser maior que o máximo';$('#s-pmin').setAttribute('aria-invalid','true');$('#s-pmax').setAttribute('aria-invalid','true');$('#s-pmin').focus();return;}
  const cur=parseFilters(parseHash().query),catId=g('s-cat'),fi=catId?catFicha(catId):null;
  const o={q:$('#q').value.trim(),cat:catId,uf:g('s-uf'),city:g('s-uf')?g('s-city'):'',pmin:pmin,pmax:pmax,sort:cur.sort,brand:'',model:'',ymin:'',ymax:'',kmax:'',amin:'',amax:'',page:1};
  if(fi==='vehicle'){o.brand=g('s-brand');o.model=g('s-model');o.ymin=g('s-ymin');o.ymax=g('s-ymax');o.kmax=g('s-kmax');}
  if(fi==='land'){o.amin=g('s-amin');o.amax=g('s-amax');}
  go(searchHref(cur,o));
}
function doLogin(form){
  clearErrs(form);$('#lg-msg').innerHTML='';
  const email=form.elements['lg-email'].value.trim(),pass=form.elements['lg-pass'].value;let bad=false;
  if(!email){setErr('lg-email','Informe o e-mail');bad=true;}if(!pass){setErr('lg-pass','Informe a senha');bad=true;}
  if(bad){$('[aria-invalid=true]',form).focus();return;}
  const box=$('#lg-msg');
  if(S.d.attempts>=5){box.innerHTML=alertBox('error','Muitas tentativas. Tente novamente em alguns minutos.',{focus:true});$('.alert',box).focus();return;}
  const u=S.d.users.find(x=>x.email.toLowerCase()===email.toLowerCase());
  if(!u||!u.active||u.pass!==pass){S.d.attempts++;persist();form.elements['lg-pass'].value='';box.innerHTML=alertBox('error','E-mail ou senha inválidos, ou conta desativada',{focus:true});$('.alert',box).focus();return;}
  S.d.attempts=0;
  if(u.mustChange){S.pending=u.id;go('#/equipe/senha-nova');return;}
  S.session.userId=u.id;const to=S.returnTo;S.returnTo=null;go(to&&to.indexOf('#/painel')===0?to:landing(u));
}
function pwValidate(form,idNew,idConf,boxId){
  clearErrs(form);$(boxId).innerHTML='';const a=form.elements[idNew].value,b=form.elements[idConf].value;
  const miss=pwMissing(a);
  if(miss.length){$(boxId).innerHTML=alertBox('error','<p>A senha não cumpre os requisitos. Falta:</p><ul>'+miss.map(x=>'<li>'+x+'</li>').join('')+'</ul>',{focus:true})+us('US-007-S06');$('.alert',$(boxId)).focus();return null;}
  if(a!==b){setErr(idConf,'As senhas não coincidem');$('#'+idConf).focus();return null;}
  return a;
}
function doNewPwd(form){
  const p=pwValidate(form,'np-new','np-conf','#np-msg');if(p==null)return;
  const u=user(S.pending);u.pass=p;u.mustChange=false;S.session.userId=u.id;S.pending=null;persist();go(landing(u));
}
function doForgot(form){
  clearErrs(form);const em=form.elements['fg-email'].value.trim();
  if(!em){setErr('fg-email','Informe o e-mail');$('#fg-email').focus();return;}
  S.d.resetUsed=false;S.resetEmail=em;S.fg={sent:true,email:em};persist();render({focus:true});
}
function doReset(form){
  const p=pwValidate(form,'rp-new','rp-conf','#rp-msg');if(p==null)return;
  const u=S.d.users.find(x=>x.email.toLowerCase()===(S.resetEmail||'ana.souza@exemplo.com.br').toLowerCase())||user('u2');
  u.pass=p;S.d.resetUsed=true;persist();S.flash={kind:'info',html:'Senha alterada. Entre com a nova senha.',keep:true};go('#/equipe/entrar');
}
function doSettings(form){
  clearErrs(form);const raw=form.elements['st-phone'].value.trim(),digits=raw.replace(/\D/g,'');
  if(!raw){setErr('st-phone','O telefone é obrigatório');$('#st-phone').focus();return;}
  if(/[A-Za-zÀ-ÿ]/.test(raw)||!(/^[1-9][1-9]\d{8,9}$/.test(digits)&&(digits.length===10||digits[2]==='9'))){setErr('st-phone','Informe um número com DDD, por exemplo (11) 91234-5678');$('#st-phone').focus();return;}
  S.d.phone=digits;persist();S.flash={kind:'ok',html:'Configurações salvas'};announce('Configurações salvas');render({keep:false});
}

/* eventos de campos (delegados) */
document.addEventListener('change',e=>{
  const t=e.target;if(!app.contains(t)&&!t.closest('dialog'))return;
  if(t.id==='s-uf'){const c=$('#s-city');c.innerHTML=cityOptions(t.value,'','Todas as cidades');c.disabled=!t.value;const l=$('#filt-live');if(l)l.textContent=t.value?'A cidade voltou para Todas as cidades. A lista mostra só cidades de '+t.value+'.':'A cidade voltou para Todas as cidades.';}
  else if(t.id==='s-cat'){const fi=t.selectedOptions[0]?t.selectedOptions[0].dataset.f:'';$$('[data-only]',$('#filters')).forEach(x=>{x.hidden=x.dataset.only!==fi;});}
  else if(t.id==='s-sort'){const cur=parseFilters(parseHash().query);go(searchHref(cur,{sort:t.value,page:1}));}
  else if(t.id==='l-st'){S.panel.status=t.value;S.panel.page=1;refreshList();}
  else if(t.id==='f-cat'){syncForm();render({keep:true});renderPhotos();announce('Campos atualizados para a categoria '+(catName(t.value)||'escolhida'));}
  else if(t.id==='pfiles'){const f=S.form;f.pending=Array.from(t.files).map(x=>({name:x.name,size:x.size,type:x.type}));t.value='';renderPhotos();announce(f.pending.length+' arquivo(s) selecionado(s)');}
});
/* Contadores de caracteres (Título em Vagas; Informações adicionais em Serviços e Vagas) */
document.addEventListener('input',e=>{const t=e.target;if((t.id!=='f-title'&&t.id!=='f-desc')||!S.form)return;const c=$('#c-'+t.id);if(c)c.textContent=t.value.length+'/'+t.maxLength;});
/* Preço: máscara R$ estilo banco — dígitos entram pelos centavos; sem negativo; teto de 10 dígitos */
document.addEventListener('input',e=>{const t=e.target;if(t.id!=='f-price'||!S.form)return;
  const d=t.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,PRICE_MAX_DIGITS);
  S.form.priceCents=d?+d:null;t.value=d?fmtCents(+d):'';
  try{t.setSelectionRange(t.value.length,t.value.length);}catch(x){}
  const er=$('#e-f-price');if(er)er.textContent='';t.removeAttribute('aria-invalid');
});
/* CEP: máscara 00000-000 + busca simulada (no site real: servidor → ViaCEP, NFR-24) */
function cepFill(f,city,uf){f.city=city;f.uf=uf;if(f.cepManual)return;const c=$('#f-city'),u=$('#f-uf');if(c)c.value=city;if(u)u.value=uf;}
function cityCtl(f){
  if(!f.uf)return '<label for="f-city">Cidade *</label><select id="f-city" disabled aria-describedby="e-f-city"><option value="">Escolha a UF primeiro</option></select><div class="err" id="e-f-city" role="alert"></div>';
  if(UFS[f.uf])return '<label for="f-city">Cidade *</label><select id="f-city" aria-required="true" aria-describedby="e-f-city">'+cityOptions(f.uf,f.city,'Escolha uma cidade')+'</select><div class="err" id="e-f-city" role="alert"></div>';
  return '<label for="f-city">Cidade *</label><input id="f-city" type="text" maxlength="80" value="'+esc(f.city)+'" aria-required="true" aria-describedby="e-f-city h-f-city"><div class="hint" id="h-f-city">Sem lista de cidades para esta UF no protótipo: o nome é padronizado ao salvar.</div><div class="err" id="e-f-city" role="alert"></div>';
}
function locHtml(f){
  if(!f.cepManual)return '<div class="row2 keep"><div><label for="f-city">Cidade (automático)</label><input id="f-city" type="text" readonly value="'+esc(f.city)+'" aria-describedby="h-f-cep"></div><div><label for="f-uf">UF (automático)</label><input id="f-uf" type="text" readonly value="'+esc(f.uf)+'" aria-describedby="h-f-cep"></div></div>';
  return alertBox('warn','Não foi possível buscar o CEP. Preencha Cidade e UF manualmente.')+us('US-008-S14')+
    '<div class="row2 keep"><div><label for="f-uf">UF *</label><select id="f-uf" aria-required="true" aria-describedby="e-f-uf"><option value="">Escolha a UF</option>'+UF_ALL.map(u=>'<option value="'+u+'"'+(f.uf===u?' selected':'')+'>'+u+'</option>').join('')+'</select><div class="err" id="e-f-uf" role="alert"></div></div>'+
    '<div id="city-wrap">'+cityCtl(f)+'</div></div>';
}
function setLocManual(f,on){if(on){f.uf='';f.city='';}f.cepManual=on;const b=$('#cep-loc');if(b)b.innerHTML=locHtml(f);}
function cepDone(){const st=$('#cep-st'),i=$('#f-cep');if(st)st.textContent='';if(i)i.removeAttribute('aria-busy');}
function cepLookup(d){
  const f=S.form,key=fmtCep(d);
  if(f.cepManual)setLocManual(f,false);
  if(cepCache.has(key)){const r=cepCache.get(key);cepSeq++;f.cepBusy=false;cepDone();cepFill(f,r[0],r[1]);announce('Cidade: '+r[0]+', '+r[1]);return;}
  const tok=++cepSeq,st=$('#cep-st'),inp=$('#f-cep');
  f.cepBusy=true;cepFill(f,'','');if(st)st.textContent='Buscando…';if(inp)inp.setAttribute('aria-busy','true');
  const attempt=n=>setTimeout(()=>{
    if(tok!==cepSeq||S.form!==f)return;
    if(S.flags.cepdown){ /* falha do serviço: 1 nova tentativa, depois preenchimento manual (NFR-24) */
      if(n<2){const s2=$('#cep-st');if(s2)s2.textContent='Buscando… (tentativa 2 de 2)';attempt(2);return;}
      f.cepBusy=false;cepDone();setLocManual(f,true);return;}
    f.cepBusy=false;cepDone();const i2=$('#f-cep');
    const r=CEP_MOCK[key];
    if(r){cepCache.set(key,r);cepFill(f,r[0],r[1]);const e=$('#e-f-cep');if(e)e.textContent='';if(i2)i2.removeAttribute('aria-invalid');announce('Cidade: '+r[0]+', '+r[1]);}
    else{cepFill(f,'','');setErr('f-cep','CEP não encontrado. Confira os números.');} /* não encontrado não é falha: sem nova tentativa */
  },S.flags.cepdown?1000:600);
  attempt(1);
}
document.addEventListener('input',e=>{const t=e.target;if(t.id!=='f-cep'||!S.form)return;
  const f=S.form,d=t.value.replace(/\D/g,'').slice(0,8);t.value=fmtCep(d);f.cep=t.value;
  const er=$('#e-f-cep');if(er)er.textContent='';t.removeAttribute('aria-invalid');
  if(d.length===8)cepLookup(d);else{cepSeq++;f.cepBusy=false;cepDone();if(f.cepManual)setLocManual(f,false);cepFill(f,'','');}
});
document.addEventListener('focusout',e=>{const t=e.target;if(t.id!=='f-cep'||!S.form)return;
  const d=t.value.replace(/\D/g,'');if(d.length>0&&d.length<8){cepFill(S.form,'','');setErr('f-cep','Informe um CEP com 8 dígitos');}
});
/* preenchimento manual: UF (27) → cidade em lista quando existe */
document.addEventListener('change',e=>{const t=e.target,f=S.form;if(!f||!f.cepManual)return;
  if(t.id==='f-uf'){f.uf=t.value;f.city='';const w=$('#city-wrap');if(w)w.innerHTML=cityCtl(f);const er=$('#e-f-uf');if(er)er.textContent='';t.removeAttribute('aria-invalid');}
  else if(t.id==='f-city'){f.city=t.value;const er=$('#e-f-city');if(er)er.textContent='';t.removeAttribute('aria-invalid');}
});
document.addEventListener('input',e=>{const t=e.target,f=S.form;if(!f||!f.cepManual||t.id!=='f-city'||t.tagName!=='INPUT')return;f.city=t.value;});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='l-q'){S.panel.q=t.value;S.panel.page=1;refreshList();}});
document.addEventListener('keydown',e=>{
  const g=e.target.closest&&e.target.closest('#gallery');
  if(g&&S.gal&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const ad=findAd(S.gal.adId);if(ad&&ad.photos.length>1){e.preventDefault();galSet(S.gal.idx+(e.key==='ArrowRight'?1:-1),'th');}}
});
let tx=null;
document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('#gallery'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null||!S.gal)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40){const ad=findAd(S.gal.adId);if(ad&&ad.photos.length>1)galSet(S.gal.idx+(dx<0?1:-1),'th');}},{passive:true});

/* =====================================================================
   15. Barra do protótipo
   ===================================================================== */
const tJump=$('#t-jump'),tRole=$('#t-role'),tState=$('#t-state');
function syncToolbar(){
  tRole.value=S.session.userId&&$('option[value="'+S.session.userId+'"]',tRole)?S.session.userId:'guest';
  tState.value=S.view.state;
  $('#f-nophone').checked=!S.d.phone;$('#f-storage').checked=S.flags.storage;$('#f-conflict').checked=S.flags.conflict;$('#f-upfail').checked=S.flags.upfail;$('#f-cepdown').checked=S.flags.cepdown;
  const h=location.hash||'#/';tJump.value=$('option[value="'+h+'"]',tJump)?h:'';
}
tJump.addEventListener('change',()=>{
  const o=tJump.selectedOptions[0];if(!o||!o.value)return;
  if(o.dataset.pending)S.pending=o.dataset.pending;
  if(o.dataset.need&&!S.session.userId){S.session.userId=o.dataset.need;pstat('Você entrou como '+user(o.dataset.need).name+' para ver esta tela.');}
  if(S.session.userId&&o.value.indexOf('#/equipe/')===0&&o.value!=='#/equipe/senha-nova'&&o.value.indexOf('redefinir')<0&&o.value!=='#/equipe/esqueci'){/* entrar com sessão ativa cai no painel */}
  go(o.value);
});
tRole.addEventListener('change',()=>{
  const v=tRole.value;
  if(v==='guest'){S.session.userId=null;S.form=null;}
  else{const u=user(v);if(!u||!u.active){pstat('Essa conta está desativada. Use a tela de entrada.');syncToolbar();return;}S.session.userId=v;}
  const r=parseHash();
  if(r.parts[0]==='equipe'&&v!=='guest'&&r.parts[1]==='entrar'){go(landing(user(v)));return;}
  if(r.parts[0]==='painel'&&v==='guest'){go('#/equipe/entrar');return;}
  render({focus:true});
});
tState.addEventListener('change',()=>{S.view.state=tState.value;render({keep:true});});
$('#t-desktop').addEventListener('click',()=>setDevice(false));
$('#t-mobile').addEventListener('click',()=>setDevice(true));
function setDevice(m){document.body.classList.toggle('mobile',m);document.body.classList.toggle('desktop',!m);$('#t-mobile').setAttribute('aria-pressed',String(m));$('#t-desktop').setAttribute('aria-pressed',String(!m));}
$('#t-us').addEventListener('click',e=>{const on=!document.body.classList.contains('show-us');document.body.classList.toggle('show-us',on);e.currentTarget.setAttribute('aria-pressed',String(on));});
$('#f-nophone').addEventListener('change',e=>{S.d.phone=e.target.checked?'':'11912345678';persist();render({keep:true});});
$('#f-storage').addEventListener('change',e=>{S.flags.storage=e.target.checked;});
$('#f-conflict').addEventListener('change',e=>{S.flags.conflict=e.target.checked;});
$('#f-upfail').addEventListener('change',e=>{S.flags.upfail=e.target.checked;});
$('#f-cepdown').addEventListener('change',e=>{S.flags.cepdown=e.target.checked;});
$('#t-expire').addEventListener('click',()=>{if(!S.session.userId){pstat('Entre no painel primeiro (use “Entrar como”).');return;}S.flags.expire=true;pstat('Sessão marcada para expirar: clique em qualquer opção do painel.');});
$('#t-reset').addEventListener('click',()=>{
  try{sessionStorage.removeItem(STORE_KEY);localStorage.removeItem(FAV_KEY);}catch(e){}
  S.d=withCep(seed());S.session.userId=null;S.pending=null;S.form=null;S.flash=null;S.panel={q:'',status:'',page:1};S.view.state='normal';S.flags={storage:false,conflict:false,upfail:false,expire:false,cepdown:false};
  history.replaceState(null,'','#/');render({focus:true});pstat('Dados reiniciados.');announce('Dados reiniciados');
});

/* =====================================================================
   16. Início
   ===================================================================== */
load();
if(!location.hash)history.replaceState(null,'','#/');
render({});
})();
</script>
